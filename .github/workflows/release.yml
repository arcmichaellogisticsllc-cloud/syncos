name: Release Certification

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.3)'
        required: true
        type: string

jobs:
  validate:
    name: Release Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syncos_synthetic_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d syncos_synthetic_release"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SYNCOS_RESTRICTED_FILE_STORAGE_DIR: /tmp/syncos-restricted-ci
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/syncos_synthetic_release
      AUTH_JWT_SECRET: syncos-isolated-ci-validation-secret-2026
      PORT: 3120
      API_BASE_URL: http://127.0.0.1:3120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Release Validation (typecheck · build · unit tests · db verify · smoke)
        run: npm run release:validate

  e2e-certify:
    name: E2E Certification
    runs-on: ubuntu-latest
    needs: validate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syncos_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d syncos_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/syncos_e2e
      AUTH_JWT_SECRET: syncos-isolated-ci-validation-secret-2026
      API_BASE_URL: http://127.0.0.1:3137
      PORT: 3137
      SYNCOS_API_BASE_URL: http://127.0.0.1:3137
      WEB_BASE_URL: http://127.0.0.1:3138
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build API
        run: npm run build -w @syncos/api
      - name: Build Worker
        run: npm run build -w @syncos/worker
      - name: Build Web
        run: npm run build -w @syncos/web
      - name: Migrate E2E database
        run: npm run db:migrate
      - name: Seed base permissions/catalog
        run: npm run db:seed
      - name: Seed E2E database
        run: npm run seed:e2e-demo
      - name: Validate seed
        run: npm run e2e:seed-smoke
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start API
        run: |
          npm run start -w @syncos/api &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3137/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3137/health
      - name: Start Web
        env:
          PORT: 3138
        run: |
          npm run start -w @syncos/web -- -H 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3138 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3138
      - name: E2E release certification suite
        run: npm run e2e:ci:release
      - name: Supplemental offline, product and identity browser checks
        run: npm run e2e:supplemental
      - name: Upload supplemental evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplemental-browser-${{ github.run_id }}
          path: test-results/
          retention-days: 30
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-release-${{ inputs.version }}-${{ github.run_id }}
          path: playwright-report/
          retention-days: 90
      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-release-${{ inputs.version }}-${{ github.run_id }}
          path: test-results/e2e-junit.xml
          retention-days: 90
          if-no-files-found: ignore
      - name: Post certification summary
        if: always()
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          E2E_STATUS="${{ job.status }}"
          VERSION="$RELEASE_VERSION"
          DATE="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          if [ "$E2E_STATUS" = "success" ]; then
            OVERALL="✅ AUTOMATED CHECKS PASSED — FULL COMPLETION GATE STILL REQUIRED"
            E2E_CELL="✅"
          else
            OVERALL="❌ AUTOMATED CHECKS FAILED"
            E2E_CELL="❌"
          fi
          {
            echo "# SyncOS Release Certification — ${VERSION}"
            echo ""
            echo "**${OVERALL}**"
            echo ""
            echo "| Gate | Status |"
            echo "|---|---|"
            echo "| Typecheck | ✅ |"
            echo "| Build (API · Worker · Web) | ✅ |"
            echo "| Unit tests | ✅ |"
            echo "| Database migration verification | ✅ |"
            echo "| Smoke tests (all domains) | ✅ |"
            echo "| E2E certification enforcer | ✅ |"
            echo "| E2E seed smoke | ✅ |"
            echo "| E2E full suite (\`e2e:ci:release\`) | ${E2E_CELL} |"
            echo ""
            echo "Automated run completed at: \`${DATE}\`"
            echo ""
            echo "Operational pilot remains blocked until integration, business, device, security, offsite recovery and deployment evidence also pass."
            echo "**Artifacts (90-day retention)**"
            echo "- Playwright HTML report: \`playwright-release-${VERSION}-${{ github.run_id }}\`"
            echo "- JUnit XML: \`junit-release-${VERSION}-${{ github.run_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
