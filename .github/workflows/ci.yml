name: Public source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@syncos/api
      - run: npm run typecheck --workspace=@syncos/web
      - run: node --test --test-concurrency=2 tests/*.test.js
